<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typetest</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f4f4f4;
    padding: 30px;
}

.container{
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

textarea{
    width: 100%;
    height: 120px;
    padding: 10px;
    font-size: 16px;
    box-sizing: border-box;
}

button{
    background: #d4001f;
    color: white;
    border: none;
    padding: 12px 25px;
    margin-top: 10px;
    cursor: pointer;
    border-radius: 5px;
    font-size: 16px;
}

button:hover{
    background: black;
}

#voorbeeld{
    margin-top: 25px;
    font-size: 24px;
    color: #cfcfcf;
    min-height: 60px;
}

#invoer{
    width: 100%;
    padding: 10px;
    font-size: 18px;
    margin-top: 20px;
    box-sizing: border-box;
}

#resultaat{
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
    <h1>Typetest</h1>

    <p>Voer hieronder een tekst in:</p>

    <textarea id="tekst"></textarea>
    <br>
    <button onclick="startTest()">Start</button>

    <div id="voorbeeld"></div>

    <input type="text" id="invoer" placeholder="Typ hier..." disabled>

    <div id="resultaat"></div>
</div>

<script>
let startTijd = 0;
let doelTekst = "";

function startTest(){
    doelTekst = document.getElementById("tekst").value.trim();

    if(doelTekst === ""){
        alert("Voer eerst een tekst in!");
        return;
    }

    document.getElementById("voorbeeld").textContent = doelTekst;
    document.getElementById("invoer").value = "";
    document.getElementById("invoer").disabled = false;
    document.getElementById("invoer").focus();
    document.getElementById("resultaat").textContent = "";

    startTijd = Date.now();
}

document.getElementById("invoer").addEventListener("input", function(){
    if(this.value === doelTekst){
        let eindTijd = Date.now();
        let seconden = ((eindTijd - startTijd) / 1000).toFixed(2);

        document.getElementById("resultaat").textContent =
            "Klaar! Tijd: " + seconden + " seconden";

        this.disabled = true;
    }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typetest</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 40px;
}

textarea, input {
    width: 80%;
    max-width: 800px;
    padding: 10px;
    font-size: 18px;
}

#voorbeeld {
    margin: 20px auto;
    width: 80%;
    max-width: 800px;
    color: lightgray;
    font-size: 24px;
    min-height: 50px;
}

button {
    padding: 10px 20px;
    font-size: 18px;
    margin: 10px;
}
</style>
</head>
<body>

<h1>Typetest</h1>

<textarea id="bronTekst" placeholder="Voer hier een tekst in"></textarea>
<br>

<button onclick="startTest()">Start</button>

<div id="voorbeeld"></div>

<input type="text" id="antwoord" placeholder="Typ hier..." disabled>

<h2 id="uitslag"></h2>

<script>
let tekst = "";
let starttijd = 0;

function startTest() {
    tekst = document.getElementById("bronTekst").value;

    if (tekst.trim() === "") {
        alert("Voer eerst een tekst in!");
        return;
    }

    document.getElementById("voorbeeld").textContent = tekst;
    document.getElementById("antwoord").value = "";
    document.getElementById("antwoord").disabled = false;
    document.getElementById("antwoord").focus();
    document.getElementById("uitslag").textContent = "";

    starttijd = Date.now();
}

document.getElementById("antwoord").addEventListener("input", function() {
    if (this.value === tekst) {
        let tijd = ((Date.now() - starttijd) / 1000).toFixed(2);

        document.getElementById("uitslag").textContent =
            "Je tijd: " + tijd + " seconden!";
    }
});
</script>

</body>
</html>
